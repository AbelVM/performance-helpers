name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Releases must not be cancelled halfway. CI (`.github/workflows/ci.yml`)
  # uses the opposite setting, on purpose.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # devDependencies are not optional here: `prepublishOnly` runs the whole
      # verify gate, which needs eslint, vitest, vite and typescript.
      - run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Verify package
        run: npm run verify

      - name: Publish package
        # The explicit verify step above is the package lifecycle gate; avoid
        # running it a second time through prepublishOnly.
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
