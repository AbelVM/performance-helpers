# CI runs the same gate a maintainer runs: `npm run verify`, with the one
# documented difference that it substitutes `test:coverage` for `test`.
#
# The step list lives in `scripts/verify.mjs`. This file used to keep its own
# copy, and the copies drifted -- CI ran neither `test:types` nor `check:bundle`
# for as long as both existed, so the committed declarations were compiled only on
# maintainers' machines and a bundle missing 70 of its 72 exports would have
# passed. **Do not add checks here.** Add them to the gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches `engines`. 22.12 is the floor because the CommonJS entry
        # point relies on `require(esm)`.
        node: ['22.12', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # One call. The step list lives in `scripts/verify.mjs` so there is exactly
      # one of it, and adding a check to the gate cannot leave CI behind -- which
      # is how CI ended up running neither `test:types` nor `check:bundle` for as
      # long as both existed.
      #
      # `VERIFY_TEST=test:coverage` is the *only* intended difference from a local
      # `npm run verify`: the thresholds in `vitest.config.js` only apply under
      # `--coverage`, so `npm test` on its own does not enforce them.
      - name: Verify
        run: npm run verify
        env:
          VERIFY_TEST: test:coverage

      # The one check CI adds rather than inherits. It is behavioural where
      # `check:bundle` inside the gate is structural: that one proves the bundle
      # exposes every export, this one proves it *runs* -- loads, constructs, and
      # computes a correct answer. `dist/` exists by this point because the gate
      # builds before it finishes.
      - name: Smoke-test the CJS bundle
        # A block scalar, not an inline `node -e "..."`: the script contains
        # colons, which made this file invalid YAML - GitHub Actions would have
        # rejected the whole workflow.
        run: |
          node -e "
            const l = require('./dist/performance-helpers.cjs');
            if (typeof l.PowerCache !== 'function' || typeof l.PowerPool !== 'function')
              throw new Error('CJS bundle missing exports');
            const h = new l.PowerHistogram();
            h.record(1); h.record(1e8);
            const p = h.percentile(99.9);
            if (!(p > 9e7)) throw new Error('histogram clamped out-of-range data: ' + p);
            console.log('cjs ok, p99.9=' + p);
          "

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: performance-helpers-dist-node${{ matrix.node }}
          path: dist/
          retention-days: 7
